<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フィアナンティ</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #060912;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
  }
  #whisper {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(210, 220, 235, 0.35);
    font-family: -apple-system, 'Hiragino Mincho ProN', serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    pointer-events: none;
    transition: opacity 1.5s ease;
  }
</style>
</head>
<body>

<div id="whisper">No one is watching this. Nothing is saved. It exists only in this moment.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>

/* ========================================================
   フィアナンティ (Fianainti)
   出会い → 固く閉ざされた砂の瓶 → 解放
   ======================================================== */

let stars = [];
let phase = "sky"; // sky -> flash -> jar -> opening -> hourglass -> end
let phaseTimer = 0;

// 出会いの光の粒子（ツインレイ）
let lightA, lightB;
let convergeProgress = 0;
let flashAlpha = 0;

// 瓶
let jarCenterX, jarCenterY;
let jarW = 140, jarH = 200;
let lidOpenAmount = 0; // 0=閉, 1=開
let sandGrains = [];
let SAND_COUNT = 260;

// 砂時計
const HG_HW = 65;
const HG_HH = 118;
const HG_NECK_W = 5;
const HG_GRAIN_COUNT = 85;
let hgCX, hgCY;
let hgTopGrains = [];
let hgFallGrains = [];
let hgBottomGrains = [];
let hgBottomPositions = [];
let hgFadeIn = 0;
let hgStartFrame = 0;
let hgAllDoneFrame = 0;

// 2本指ジェスチャー
let gestureStartYs = {};
let gestureProgress = 0;
let gestureActive = false;

function setup() {
  createCanvas(windowWidth, windowHeight);
  noStroke();

  for (let i = 0; i < 180; i++) {
    stars.push({
      x: random(width),
      y: random(height),
      r: random(0.5, 1.8),
      tw: random(TWO_PI)
    });
  }

  jarCenterX = width / 2;
  jarCenterY = height / 2 + 40;

  lightA = { x: -40, y: -40, tx: jarCenterX, ty: jarCenterY };
  lightB = { x: width + 40, y: height + 40, tx: jarCenterX, ty: jarCenterY };

  for (let i = 0; i < SAND_COUNT; i++) {
    sandGrains.push(makeSandGrain());
  }
}

function makeSandGrain() {
  let angle = random(TWO_PI);
  let radius = random(0, jarW * 0.32);
  return {
    x: jarCenterX + cos(angle) * radius,
    y: jarCenterY + 30 + random(-60, 60),
    vx: 0,
    vy: 0,
    settled: true,
    col: null,
    size: random(1.6, 3.2)
  };
}

function draw() {
  drawSky();

  if (phase === "sky") {
    updateConverge();
  } else if (phase === "flash") {
    updateFlash();
  } else if (phase === "jar") {
    drawJarScene();
    updateGesture();
  } else if (phase === "opening") {
    drawJarScene();
    updateOpening();
  } else if (phase === "hourglass") {
    updateHourglass();
    drawHourglass();
  } else if (phase === "end") {
    drawEndScene();
  }
}

function drawSky() {
  background(6, 9, 18);
  for (let s of stars) {
    s.tw += 0.02;
    let a = map(sin(s.tw), -1, 1, 60, 180);
    fill(210, 220, 240, a);
    circle(s.x, s.y, s.r);
  }
}

/* ---------------- シーン1: 出会い ---------------- */

function updateConverge() {
  convergeProgress += 0.002;
  convergeProgress = min(convergeProgress, 1);

  let ax = lerp(-40, jarCenterX, easeInOut(convergeProgress));
  let ay = lerp(-40, jarCenterY, easeInOut(convergeProgress));
  let bx = lerp(width + 40, jarCenterX, easeInOut(convergeProgress));
  let by = lerp(height + 40, jarCenterY, easeInOut(convergeProgress));

  drawLightTrail(ax, ay, [255, 245, 220]);
  drawLightTrail(bx, by, [220, 235, 255]);

  if (convergeProgress >= 1) {
    phase = "flash";
    phaseTimer = 0;
  }
}

function drawLightTrail(x, y, rgb) {
  for (let i = 0; i < 12; i++) {
    let a = map(i, 0, 12, 90, 0);
    fill(rgb[0], rgb[1], rgb[2], a);
    circle(x, y, 10 - i * 0.6);
  }
  fill(255, 255, 255, 220);
  circle(x, y, 8);
}

function updateFlash() {
  phaseTimer++;
  flashAlpha = phaseTimer < 20 ? map(phaseTimer, 0, 20, 0, 200) : map(phaseTimer, 20, 40, 200, 0);
  fill(255, 255, 255, max(flashAlpha, 0));
  rect(0, 0, width, height);

  if (phaseTimer > 40) {
    phase = "jar";
  }
}

/* ---------------- シーン2: 瓶 ---------------- */

function drawJarScene() {
  push();
  translate(0, lidOpenAmount * -20);

  // 瓶本体（ガラス）
  noFill();
  stroke(180, 200, 220, 90);
  strokeWeight(2);
  rectMode(CENTER);
  let jarTiltAngle = 0;

  push();
  translate(jarCenterX, jarCenterY);
  rotate(jarTiltAngle);
  translate(-jarCenterX, -jarCenterY);

  // ガラス輪郭（丸みのある瓶）
  beginShape();
  vertex(jarCenterX - jarW * 0.28, jarCenterY - jarH * 0.5);
  vertex(jarCenterX + jarW * 0.28, jarCenterY - jarH * 0.5);
  vertex(jarCenterX + jarW * 0.5, jarCenterY - jarH * 0.15);
  vertex(jarCenterX + jarW * 0.5, jarCenterY + jarH * 0.42);
  vertex(jarCenterX + jarW * 0.32, jarCenterY + jarH * 0.5);
  vertex(jarCenterX - jarW * 0.32, jarCenterY + jarH * 0.5);
  vertex(jarCenterX - jarW * 0.5, jarCenterY + jarH * 0.42);
  vertex(jarCenterX - jarW * 0.5, jarCenterY - jarH * 0.15);
  endShape(CLOSE);

  // 蓋
  noStroke();
  let lidY = jarCenterY - jarH * 0.5 - 14 - lidOpenAmount * 90;
  let lidAlpha = 220 * (1 - lidOpenAmount);
  fill(140, 150, 165, lidAlpha);
  rectMode(CENTER);
  rect(jarCenterX, lidY, jarW * 0.62, 20, 6);

  pop();
  pop();

  // 砂
  drawSand(jarTiltAngle);

  if (phase === "jar" && gestureActive) {
    noFill();
    stroke(255, 255, 255, 40 + gestureProgress * 100);
    strokeWeight(2);
    circle(jarCenterX, jarCenterY - jarH * 0.5 - 14, 60 + gestureProgress * 20);
  }
}

function drawSand(tiltAngle) {
  for (let g of sandGrains) {
    fill(g.col ? g.col : color(120, 112, 100, 235));
    circle(g.x, g.y, g.size);
  }
}

/* ---------------- 2本指ジェスチャー ---------------- */

function updateGesture() {
  if (touches.length === 2) {
    gestureActive = true;
    let total = 0;
    for (let t of touches) {
      let id = t.id;
      if (gestureStartYs[id] === undefined) gestureStartYs[id] = t.y;
      total += (gestureStartYs[id] - t.y);
    }
    let avg = total / touches.length;
    gestureProgress = constrain(avg / 90, 0, 1);

    if (gestureProgress >= 1) {
      phase = "opening";
      gestureActive = false;
      gestureStartYs = {};
    }
  } else {
    gestureActive = false;
    gestureProgress *= 0.9;
    if (touches.length === 0) gestureStartYs = {};
  }
}

function touchStarted() {
  return false; // デフォルトのスクロール等を抑制
}

function touchEnded() {
  if (touches.length < 2) {
    gestureStartYs = {};
  }
  return false;
}

// デスクトップ用フォールバック: クリックで jar → opening へ進む
function mousePressed() {
  if (phase === "jar") {
    console.log("[phase] jar → opening (mouse fallback)");
    phase = "opening";
    gestureActive = false;
    gestureStartYs = {};
  }
  return false;
}

/* ---------------- シーン3: 解放 ---------------- */

function updateOpening() {
  lidOpenAmount = min(lidOpenAmount + 0.03, 1);
  if (lidOpenAmount >= 1) {
    phase = "hourglass";
    console.log("[phase] opening → hourglass");
    initHourglass();
    console.log("[initHourglass] topGrains:", hgTopGrains.length, "bottomPositions:", hgBottomPositions.length);
  }
}

/* ---------------- シーン3: 砂時計 ---------------- */

function initHourglass() {
  hgCX = width / 2;
  hgCY = height / 2;
  hgTopGrains = [];
  hgFallGrains = [];
  hgBottomGrains = [];
  hgBottomPositions = [];
  hgFadeIn = 0;
  hgStartFrame = frameCount;
  hgAllDoneFrame = 0;

  // 上チャンバーに砂を配置（上が広く、首が狭い三角形）
  for (let i = 0; i < HG_GRAIN_COUNT; i++) {
    let yFrac = random(0.08, 0.93);
    let y = (hgCY - HG_HH) + yFrac * HG_HH;
    let xRange = lerp(HG_HW, HG_NECK_W, yFrac) * 0.86;
    let x = hgCX + random(-xRange, xRange);
    hgTopGrains.push({
      x, y, yFrac,
      size: random(2, 3.5),
      r: floor(random(175, 215)),
      g_: floor(random(150, 175)),
      b_: floor(random(120, 148))
    });
  }
  // 首に近いほど先に落ちるよう y 降順でソート
  hgTopGrains.sort((a, b) => b.y - a.y);

  // 下チャンバーの着地点を下から積み上げる形で事前計算
  let rowH = 4.5;
  for (let row = 0; hgBottomPositions.length < HG_GRAIN_COUNT; row++) {
    let yFromBottom = row * rowH + 5;
    if (yFromBottom >= HG_HH - 8) break;
    let y = hgCY + HG_HH - yFromBottom;
    let fracFromNeck = (y - hgCY) / HG_HH;
    let xRange = lerp(HG_NECK_W, HG_HW, fracFromNeck) * 0.83;
    let cols = max(1, floor(xRange * 2 / 5));
    for (let c = 0; c < cols && hgBottomPositions.length < HG_GRAIN_COUNT; c++) {
      let x = hgCX - xRange + (c + 0.5) * (xRange * 2 / cols) + random(-1, 1);
      hgBottomPositions.push({ x, y: y + random(-0.5, 0.5) });
    }
  }
}

function updateHourglass() {
  hgFadeIn = min(hgFadeIn + 0.03, 1); // 約33フレームでフェードイン完了

  let elapsed = frameCount - hgStartFrame - 30; // 0.5秒待ってから落ち始める
  if (elapsed > 0) { // hgFadeIn の完了を待たずに落下開始
    let targetReleased = floor(elapsed / 5);
    let currentReleased = hgBottomGrains.length + hgFallGrains.length;
    while (currentReleased < targetReleased && hgTopGrains.length > 0) {
      let g = hgTopGrains.pop();
      let dest = hgBottomPositions[currentReleased] || { x: hgCX + random(-4, 4), y: hgCY + HG_HH - 5 };
      hgFallGrains.push({
        x: hgCX + random(-HG_NECK_W * 0.6, HG_NECK_W * 0.6),
        y: hgCY + HG_NECK_W,
        vy: random(1.5, 2.5),
        size: g.size,
        r: g.r, g_: g.g_, b_: g.b_,
        destX: dest.x, destY: dest.y
      });
      currentReleased++;
    }
  }

  // 落下中の砂粒を更新
  for (let i = hgFallGrains.length - 1; i >= 0; i--) {
    let g = hgFallGrains[i];
    g.vy = min(g.vy + 0.2, 6);
    g.y += g.vy;
    if (g.y >= g.destY) {
      hgBottomGrains.push({ x: g.destX, y: g.destY, size: g.size, r: g.r, g_: g.g_, b_: g.b_ });
      hgFallGrains.splice(i, 1);
    }
  }

  // 全粒子が着地したら終了へ
  if (elapsed > 0 && hgTopGrains.length === 0 && hgFallGrains.length === 0) {
    if (hgAllDoneFrame === 0) hgAllDoneFrame = frameCount;
    if (frameCount - hgAllDoneFrame > 150) {
      phase = "end";
      fadeWhisper();
    }
  }
}

function drawHourglass() {
  let a = hgFadeIn;
  push();

  // 砂時計のフレーム（ガラス輪郭）
  stroke(180, 200, 220, 75 * a);
  strokeWeight(1.5);
  noFill();

  // 上半分
  beginShape();
  vertex(hgCX - HG_HW, hgCY - HG_HH);
  vertex(hgCX + HG_HW, hgCY - HG_HH);
  vertex(hgCX + HG_NECK_W, hgCY);
  vertex(hgCX - HG_NECK_W, hgCY);
  endShape(CLOSE);

  // 下半分
  beginShape();
  vertex(hgCX - HG_NECK_W, hgCY);
  vertex(hgCX + HG_NECK_W, hgCY);
  vertex(hgCX + HG_HW, hgCY + HG_HH);
  vertex(hgCX - HG_HW, hgCY + HG_HH);
  endShape(CLOSE);

  // 上下のキャップ（枠）
  strokeWeight(2);
  stroke(180, 200, 220, 90 * a);
  line(hgCX - HG_HW - 8, hgCY - HG_HH, hgCX + HG_HW + 8, hgCY - HG_HH);
  line(hgCX - HG_HW - 8, hgCY + HG_HH, hgCX + HG_HW + 8, hgCY + HG_HH);

  noStroke();

  // 上チャンバーの砂
  for (let g of hgTopGrains) {
    fill(g.r, g.g_, g.b_, 215 * a);
    circle(g.x, g.y, g.size);
  }

  // 落下中の砂
  for (let g of hgFallGrains) {
    fill(g.r, g.g_, g.b_, 200 * a);
    circle(g.x, g.y, g.size);
  }

  // 下チャンバーの砂（グレーからゴールドへ）
  for (let g of hgBottomGrains) {
    let fracFromNeck = constrain((g.y - hgCY) / HG_HH, 0, 1);
    let r = lerp(g.r, 255, fracFromNeck * 0.55);
    let gr = lerp(g.g_, 214, fracFromNeck * 0.5);
    let b = lerp(g.b_, 100, fracFromNeck * 0.4);
    fill(r, gr, b, 215 * a);
    circle(g.x, g.y, g.size);
  }

  pop();
}

/* ---------------- 終景 ---------------- */

function drawEndScene() {
  // 空だけが残る。テキストなし、評価なし。
}

function fadeWhisper() {
  let el = document.getElementById("whisper");
  if (el) {
    el.style.opacity = "0";
  }
}

/* ---------------- ユーティリティ ---------------- */

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - pow(-2 * t + 2, 2) / 2;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  jarCenterX = width / 2;
  jarCenterY = height / 2 + 40;
}

</script>
</body>
</html>
